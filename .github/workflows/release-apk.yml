name: Signed Release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate signing secrets
        shell: bash
        env:
          KWL_KEYSTORE_BASE64: ${{ secrets.KWL_KEYSTORE_BASE64 }}
          KWL_KEYSTORE_PASSWORD: ${{ secrets.KWL_KEYSTORE_PASSWORD }}
          KWL_KEY_ALIAS: ${{ secrets.KWL_KEY_ALIAS }}
          KWL_KEY_PASSWORD: ${{ secrets.KWL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KWL_KEYSTORE_BASE64 KWL_KEYSTORE_PASSWORD KWL_KEY_ALIAS KWL_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. Configure it in repository Actions secrets."
              exit 1
            fi
          done
          printf '%s' "$KWL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kwl-release.jks"
          chmod 600 "$RUNNER_TEMP/kwl-release.jks"
      - name: Build signed release APK
        shell: bash
        env:
          KWL_KEYSTORE_PATH: ${{ runner.temp }}/kwl-release.jks
          KWL_KEYSTORE_PASSWORD: ${{ secrets.KWL_KEYSTORE_PASSWORD }}
          KWL_KEY_ALIAS: ${{ secrets.KWL_KEY_ALIAS }}
          KWL_KEY_PASSWORD: ${{ secrets.KWL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          sha256sum "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: KWL-Sticker-Maker-SIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/kwl-release.jks"
