name: Android Emulator Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Inspect APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 15
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Boot emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.kwl360.stickermaker/.MainActivity
            sleep 5
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|Process: com.kwl360.stickermaker'; then
              echo "Application crash detected"
              exit 1
            fi
            adb shell pidof com.kwl360.stickermaker
      - name: Save diagnostic logs
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          adb logcat -d -s AndroidRuntime:E > diagnostics/android-runtime.txt 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Emulator-Diagnostics
          path: diagnostics/
