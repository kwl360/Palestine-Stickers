plugins { id 'com.android.application' }

android {
    namespace 'com.kwl360.stickermaker'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kwl360.stickermaker'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            if (System.getenv('KWL_KEYSTORE_PATH')) {
                storeFile file(System.getenv('KWL_KEYSTORE_PATH'))
                storePassword System.getenv('KWL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KWL_KEY_ALIAS')
                keyPassword System.getenv('KWL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KWL_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
